function loadEquiv(kg){
  if(!(kg>0))return `<div class="load-eq load-eq-empty" aria-label="外部負荷0kg"><svg viewBox="0 0 48 34" aria-hidden="true"><ellipse class="il-g" cx="24" cy="29" rx="15" ry="2"/><rect class="il-d" x="15" y="18" width="18" height="3" rx="1.5"/><rect class="il-b" x="9" y="13" width="4" height="13" rx="1.5"/><rect class="il-w" x="13" y="15" width="3" height="9" rx="1"/><rect class="il-b" x="35" y="13" width="4" height="13" rx="1.5"/><rect class="il-w" x="32" y="15" width="3" height="9" rx="1"/></svg><div class="load-eq-text"><strong>準備中</strong><small>記録で重さ比較</small></div></div>`;
  let item=loadScales[0],bestDiff=Infinity;
  for(const s of loadScales){const d=Math.abs(Math.log(kg/s.kg));if(d<bestDiff){bestDiff=d;item=s}}
  const mult=kg>=item.kg*1.6?Math.round(kg/item.kg):1,label=mult>1?`${item.name}×${mult}`:item.name,refKg=item.kg*mult;
  return `<div class="load-eq" role="img" aria-label="${esc(label)}（約${fmt(refKg)}kg）と同じくらいの重さ"><svg viewBox="0 0 48 34" aria-hidden="true">${item.svg}</svg><div class="load-eq-text"><strong>${esc(label)}</strong><small>約${fmt(refKg)}kg</small></div></div>`;
}

function historyView(){let [y,m]=month.split('-').map(Number),first=new Date(y,m-1,1).getDay(),days=new Date(y,m,0).getDate();return `<section><div class="row"><button class="secondary" onclick="changeMonth(-1)">‹</button><h3 style="text-align:center">${month}</h3><button class="secondary" onclick="changeMonth(1)">›</button></div><div class="calendar">${['日','月','火','水','木','金','土'].map(s=>`<small style="text-align:center">${s}</small>`).join('')}${'<span></span>'.repeat(first)}${Array.from({length:days},(_,i)=>{let d=month+'-'+String(i+1).padStart(2,'0'),ss=byDate(d),ww=watchWorkouts(d);return `<button class="${ss.length||ww.length?'marked':''} ${d===date?'chosen':''}" onclick="date='${d}';render()">${i+1}${ss.length?'<br>'+ss.length+'set':''}${ww.length?'<br>Watch':''}</button>`}).join('')}</div></section><section><h3>${date}</h3>${entries(date)}${workoutRingCards(watchWorkouts(date))}<p>${esc(db.notes[date]||'')}</p><button class="full" onclick="go('log')">この日の記録を編集</button></section>`}function changeMonth(n){let [y,m]=month.split('-').map(Number),d=new Date(y,m-1+n,1);month=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');render()}
let metric='max';function stats(){let ss=db.sets.filter(s=>s.e===exercise&&s.mode!=='body');return `<section><label>種目<select onchange="exercise=this.value;render()">${db.exercises.map(e=>`<option value="${e.id}" ${e.id===exercise?'selected':''}>${esc(e.name)}</option>`).join('')}</select></label><div class="grid"><div><small>最大重量</small><div class="big">${fmt(best(exercise))}</div></div><div><small>推定MAX (Epley)</small><div class="big">${fmt(Math.max(0,...ss.map(est)))}</div></div></div><label>グラフ<select onchange="metric=this.value;render()"><option value="max" ${metric==='max'?'selected':''}>最大重量</option><option value="est" ${metric==='est'?'selected':''}>推定MAX</option><option value="vol" ${metric==='vol'?'selected':''}>総外部負荷</option><option value="body" ${metric==='body'?'selected':''}>体重</option></select></label><canvas id="chart"></canvas><small>推定MAXは目安。左右重量は片手表示。外部負荷には自重を含まない。</small></section><section><h3>体重記録</h3><form onsubmit="addWeight(event)"><div class="row"><input id="wd" type="date" value="${today()}" required><input id="wk" type="number" min="1" max="500" step="0.1" placeholder="kg" required></div><button class="full">体重を保存</button></form>${[...db.weights].sort((a,b)=>b.date.localeCompare(a.date)).map(w=>`<div class="entry"><div>${esc(w.date)} / ${fmt(w.kg)}kg</div><button class="danger" onclick="db.weights=db.weights.filter(x=>x.id!=='${w.id}');save();render()">削除</button></div>`).join('')}</section><section><h3>直近30日の部位別セット数</h3>${parts.map(p=>{let cutoff=new Date();cutoff.setDate(cutoff.getDate()-29);let n=db.sets.filter(s=>ex(s.e)?.part===p&&new Date(s.date+'T23:59:59')>=cutoff&&s.date<=today()).length;return `<div class="entry"><div>${p}</div>${n} セット</div>`}).join('')}</section>`}function addWeight(e){e.preventDefault();let date=$('wd').value,kg=+$('wk').value;db.weights=db.weights.filter(w=>w.date!==date);db.weights.push({id:uid(),date,kg});save();render();toast('体重を保存しました')}function draw(){let c=$('chart');if(!c)return;let w=c.clientWidth||300,h=190,dpr=devicePixelRatio||1;c.width=w*dpr;c.height=h*dpr;let ctx=c.getContext('2d');ctx.scale(dpr,dpr);let map={};if(metric==='body'){db.weights.forEach(s=>map[s.date]=s.kg)}else db.sets.filter(s=>s.e===exercise&&(metric==='vol'||s.mode!=='body')).forEach(s=>{map[s.date]=metric==='vol'?(map[s.date]||0)+volume(s):Math.max(map[s.date]||0,metric==='est'?est(s):s.w)});let pts=Object.entries(map).sort();ctx.fillStyle='#aabbd0';ctx.font='11px system-ui';if(!pts.length){ctx.fillText('データなし',12,30);return}let vals=pts.map(p=>p[1]),lo=Math.min(...vals),hi=Math.max(...vals),pad=Math.max((hi-lo)*.12,1);lo=Math.max(0,lo-pad);hi+=pad;let xy=(v,i)=>[40+(w-58)*(pts.length===1?.5:i/(pts.length-1)),12+(h-42)*(hi-v)/(hi-lo)];for(let i=0;i<4;i++){let y=12+(h-42)*i/3;ctx.strokeStyle='#35445b';ctx.beginPath();ctx.moveTo(40,y);ctx.lineTo(w-12,y);ctx.stroke();ctx.fillText(fmt(hi-(hi-lo)*i/3),0,y+4)}ctx.strokeStyle='#6ba4ff';ctx.lineWidth=2;ctx.beginPath();pts.forEach((p,i)=>{let [x,y]=xy(p[1],i);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();pts.forEach((p,i)=>{let [x,y]=xy(p[1],i);ctx.fillStyle='#6ba4ff';ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fill();if(i===0||i===pts.length-1||pts.length<=4){ctx.fillStyle='#aabbd0';ctx.fillText(p[0].slice(5),x-15,h-5)}})}
function settings(){return `<section><h3>目標設定</h3><form onsubmit="event.preventDefault();db.goals={bench:+$('gb').value,body:+$('gw').value};save();render();toast('目標を保存しました')"><div class="grid"><label>ベンチ kg<input id="gb" type="number" min="1" required value="${db.goals.bench}"></label><label>体重 kg<input id="gw" type="number" min="1" required value="${db.goals.body}"></label></div><button class="full">保存</button></form></section><section><h3>種目の追加・編集</h3><form onsubmit="saveExercise(event)"><label>編集対象<select id="eid" onchange="let e=ex(this.value);$('en').value=e?.name||'';$('ep').value=e?.part||'胸'"><option value="">新規追加</option>${db.exercises.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('')}</select></label><label>種目名<input id="en" required maxlength="80"></label><label>部位<select id="ep">${parts.map(p=>`<option>${p}</option>`).join('')}</select></label><button class="full">種目を保存</button></form></section>${watchSettings()}<section><h3>バックアップ・共有</h3><button class="full secondary" onclick="downloadBackup()">全データをJSON保存</button><label>バックアップから復元（現在のデータを置換）<input type="file" accept=".json,application/json" onchange="readFile(this,restore)"></label><button class="full secondary" onclick="shareAll()">全記録をChatGPT用にコピー</button><p class="muted">データはこのブラウザ内に保存されます。端末間で自動同期はしません。定期的にバックアップしてください。</p></section>`}function saveExercise(ev){ev.preventDefault();let id=$('eid').value,n=$('en').value.trim(),p=$('ep').value;if(!n)return;if(id)Object.assign(ex(id),{name:n,part:p});else db.exercises.push({id:uid(),name:n,part:p});save();render();toast('種目を保存しました')}
function readFile(input,fn){let f=input.files[0];if(f)f.text().then(fn).catch(()=>alert('ファイルを読めませんでした'))}const validDate=d=>typeof d==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d)&&!isNaN(Date.parse(d));function downloadBackup(){let url=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));let a=document.createElement('a');a.href=url;a.download='iron-log-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function restore(raw){try{let d=JSON.parse(raw),safeId=s=>typeof s==='string'&&/^[a-zA-Z0-9-]+$/.test(s),num=n=>typeof n==='number'&&Number.isFinite(n)&&n>=0;if(d.version!==1||!Array.isArray(d.exercises)||!d.exercises.length||!d.exercises.every(e=>safeId(e.id)&&typeof e.name==='string'&&parts.includes(e.part))||!Array.isArray(d.sets)||!d.sets.every(s=>safeId(s.id)&&validDate(s.date)&&d.exercises.some(e=>e.id===s.e)&&num(s.w)&&Number.isInteger(s.reps)&&s.reps>0&&['normal','pair','single','body'].includes(s.mode))||!Array.isArray(d.weights)||!d.weights.every(w=>safeId(w.id)&&validDate(w.date)&&num(w.kg)&&w.kg>0)||(d.health!==undefined&&(!Array.isArray(d.health)||!d.health.every(h=>validDate(h.date)&&['minutes','kcal','bpm','steps','kg'].every(k=>h[k]==null||num(h[k])))))||!validWorkoutBackup(d.watchWorkouts)||!d.goals||!num(d.goals.bench)||!d.goals.bench||!num(d.goals.body)||!d.goals.body||!num(d.rest)||!d.notes||typeof d.notes!=='object')throw Error();if(confirm('現在の記録をバックアップの内容で置き換えますか？')){db={health:[],...d};exercise=db.exercises[0].id;save();render();toast('復元しました')}}catch(e){alert('IRON LOGの有効なバックアップではありません。')}}function dayText(d){let w=db.weights.find(w=>w.date===d);return `${d}\n`+byDate(d).map(s=>`${name(s.e)} ${s.mode==='body'?'自重＋':''}${s.w}kg × ${s.reps}回${s.mode==='pair'?'（左右各）':''}${s.note?' '+s.note:''}`).join('\n')+(db.notes[d]?'\nメモ：'+db.notes[d]:'')+(w?'\n体重：'+w.kg+'kg':'')+watchWorkouts(d).map(w=>'\nApple Watch：'+watchTypes[w.type]+' '+workoutSummary(w)).join('')}async function copyText(t){try{await navigator.clipboard.writeText(t);toast('コピーしました')}catch(e){let a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{if(!document.execCommand('copy'))throw Error();toast('コピーしました')}catch(e){prompt('以下をコピーしてください',t)}a.remove()}}function shareDay(){copyText(dayText(date)+'\nこのトレーニングを評価し、次回のメニューを提案してください。')}function shareAll(){copyText([...new Set([...db.sets,...db.weights,...watchWorkouts()].map(s=>s.date))].sort().map(dayText).join('\n\n')+'\n目標：ベンチ'+db.goals.bench+'kg、体重'+db.goals.body+'kg')}
render();

syncHealthyWorkouts();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') syncHealthyWorkouts();
});
window.addEventListener('online', () => syncHealthyWorkouts());

window.addEventListener('storage', event => {
  if (event.key !== 'ironlog-v1' || !event.newValue) return;
  db = JSON.parse(event.newValue);
  if (tab === 'home' || tab === 'history') render();
});
window.addEventListener('resize',()=>{if(tab==='stats')draw()});if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></html>
