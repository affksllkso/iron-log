*{box-sizing:border-box}body{margin:0;background:#0b1019;color:#eef4ff;font:16px system-ui,sans-serif}main{max-width:760px;margin:auto;padding:18px 16px 100px}header{display:flex;justify-content:space-between;align-items:center}h1{letter-spacing:3px;margin:10px 0;color:#77aaff}h2{font-size:20px}h3{font-size:16px}small,.muted{color:#9caec5}section,.panel{background:#151e2c;border:1px solid #26364d;border-radius:16px;padding:16px;margin:12px 0}input,select,button,textarea{font:inherit;border-radius:9px;padding:11px;border:1px solid #354762;color:#eef4ff;background:#101827;min-width:0}input,select,textarea{width:100%}button{cursor:pointer;background:#225fc4;border-color:#397bea;font-weight:600}button.secondary{background:#19283d}button.danger{background:#422536;border-color:#734056}button:disabled{opacity:.5}label{display:block;color:#b4c4db;font-size:13px;margin:8px 0}label input,label select{display:block;margin-top:5px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.big{font-size:32px;font-weight:800}.bar{height:9px;background:#29394e;border-radius:12px;overflow:hidden}.bar i{display:block;height:100%;background:#5896ff}nav{position:fixed;bottom:0;left:0;right:0;background:#111a28;border-top:1px solid #34445b;display:flex;justify-content:center;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:3}nav button{background:transparent;border:0;font-size:12px;max-width:140px;flex:1;padding:12px 3px;color:#a3b6d0}nav button.active{color:#81b2ff;background:#1d304c}.entry{border-top:1px solid #29394e;padding:10px 0;display:flex;align-items:center;gap:8px}.entry>div{flex:1}.entry button{font-size:12px;padding:7px}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.calendar button{padding:8px 2px;font-size:12px;background:#202e43;min-height:48px}.calendar .marked{background:#245caf}.calendar .chosen{outline:2px solid #a9caff}.timer{positio </style><main><header><h1>IRON LOG</h1><small>PERSONAL TRAINING</small></header><div id="timer" class="timer" hidden><strong id="clock">00:00</strong><button class="secondary" onclick="stopTimer()">停止</button></div><div id="app"></div></main><nav id="nav"></nav><div id="toast" role="status"></div><script>
'use strict';const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`},uid=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2),fmt=n=>Number(n).toLocaleString('ja-JP',{maximumFractionDigits:1});
const catalog=[['ベンチプレス','胸'],['インクラインスミスベンチプレス','胸'],['ケーブルチェストプレス','胸'],['ペックフライ','胸'],['ディップス','胸'],['ダンベルショルダープレス','肩'],['ケーブルサイドレイズ','肩'],['マシンショルダープレス','肩'],['デッドリフト','背中'],['ハーフデッドリフト','背中'],['ラットプルダウン','背中'],['シーテッドロー','背中'],['ダンベルロー','背中'],['チンニング','背中'],['インクラインダンベルカール','腕'],['インクラインダンベルハンマーカール','腕'],['オーバーヘッドエクステンション','腕'],['EZバーカール','腕'],['ケーブルプレスダウン','腕'],['ケーブルオーバーヘッドエクステンション','腕'],['バーベルスクワット','脚'],['ブルガリアンスクワット','脚'],['ナローベンチプレス','胸']];
function seed(){return {version:1,exercises:catalog.map(([name,part],i)=>({id:'e'+i,name,part})),sets:[],weights:[],health:[],goals:{bench:100,body:75},rest:180,notes:{}}}
let db;try{db=JSON.parse(localStorage.getItem('ironlog-v1'))||seed()}catch(e){db=seed()}let tab='home',date=today(),month=date.slice(0,7),exercise='e0',part='全部',editId=null,timerEnd=0,toastHandle;function save(){try{localStorage.setItem('ironlog-v1',JSON.stringify(db));return true}catch(e){alert('保存できませんでした。バックアップを出力してください。');return false}}save();function toast(s){$('toast').textContent=s;$('toast').style.display='block';clearTimeout(toastHandle);toastHandle=setTimeout(()=>$('toast').style.display='none',3500)}const ex=id=>db.exercises.find(e=>e.id===id),name=id=>ex(id)?.name||'不明',byDate=d=>db.sets.filter(s=>s.date===d),volume=s=>s.w*s.reps*(s.mode==='pair'?2:1),est=s=>s.reps===1?s.w:s.w*(1+s.reps/30),best=id=>Math.max(0,...db.sets.filter(s=>s.e===id&&s.mode!=='body').map(s=>s.w)),latestWeight=()=>[...db.weights].sort((a,b)=>b.date.localeCompare(a.date)).at(0),parts=['胸','背中','脚','肩','腕','腹','その他'],tabs=[['home','ホーム'],['log','記録'],['history','履歴'],['stats','分析'],['settings','設定']];function go(t){tab=t;editId=null;render()}function render(){ $('nav').innerHTML=tabs.map(([id,label])=>`<button class="${tab===id?'active':''}" onclick="go('${id}')">${label}</button>`).join('');$('app').innerHTML=({home,log,history,stats,settings}[tab])();if(tab==='stats')draw();}
function progress(value,target){return `<div class="bar"><i style="width:${Math.min(100,Math.max(0,value/target*100))}%"></i></div>`}function home(){let w=latestWeight(),b=best('e0'),h=[...db.health].sort((a,b)=>b.date.localeCompare(a.date))[0];return `<section><small>ROAD TO ${esc(db.goals.bench)} KG</small><div class="big">${fmt(b)} <small>kg</small></div>${progress(b,db.goals.bench)}<p class="muted">ベンチプレス 目標まで ${fmt(Math.max(0,db.goals.bench-b))} kg</p><button class="full" onclick="date=today();go('log')">＋ トレーニングを記録</button></section><div class="grid"><div class="panel"><small>最新体重</small><div class="big">${w?fmt(w.kg):'―'}<small> kg</small></div>${w?progress(w.kg,db.goals.body):''}<small>${w?esc(w.date):''} / 目標 ${db.goals.body}kg</small></div><div class="panel"><small>今日のセット</small><div class="big">${byDate(today()).length}</div><small>外部負荷 ${fmt(byDate(today()).reduce((a,s)=>a+volume(s),0))} kg</small></div></div><section><h3>Apple Watch / ヘルスケア</h3>${h?`<small>${esc(h.date)} の取り込みデータ</small><div class="grid">${[['運動時間',h.minutes,'分'],['消費エネルギー',h.kcal,'kcal'],['平均心拍',h.bpm,'bpm'],['歩数',h.steps,'歩']].map(([l,v,u])=>`<div><small>${l}</small><p>${v==null?'―':fmt(v)+' '+u}</p></div>`).join('')}</div>`:'<p class="muted">まだ取り込みデータがありません。</p>'}<button class="secondary full" onclick="go('settings')">ヘルスケア取り込み</button></section><section><h3>最近のトレーニング</h3>${[...new Set(db.sets.map(s=>s.date))].sort().reverse().slice(0,5).map(d=>`<div class="entry"><div>${d}<br><small>${esc([...new Set(byDate(d).map(s=>ex(s.e)?.part))].join('・'))} / ${byDate(d).length}セット</small></div><button class="secondary" onclick="date='${d}';go('log')">詳細</button></div>`).join('')}</section>`}
function options(){return db.exercises.filter(e=>part==='全部'||e.part===part||e.id===exercise).map(e=>`<option value="${esc(e.id)}" ${e.id===exercise?'selected':''}>${esc(e.name)}</option>`).join('')}function log(){let s=db.sets.find(s=>s.id===editId),prev=db.sets.filter(s=>s.e===exercise&&s.date<date).sort((a,b)=>b.date.localeCompare(a.date)),pd=prev[0]?.date,p=prev.filter(s=>s.date===pd),last=byDate(date).filter(s=>s.e===exercise).at(-1)||p.at(-1);return `<section><label>日付<input type="date" value="${date}" onchange="date=this.value;editId=null;render()"></label><label>部位<select onchange="part=this.value;let e=db.exercises.find(e=>part==='全部'||e.part===part);if(e)exercise=e.id;editId=null;render()">${['全部',...parts].map(p=>`<option ${p===part?'selected':''}>${p}</option>`).join('')}</select></label><label>種目<select onchange="exercise=this.value;editId=null;render()">${options()}</select></label><div class="muted">前回 ${pd||'記録なし'} ${p.map(s=>`${s.w}kg×${s.reps}`).join(' / ')}</div><form id="setform" onsubmit="addSet(event)"><div class="grid"><label>重量 kg<input id="w" type="number" min="0" step="0.01" required value="${s?.w??last?.w??0}"></label><label>回数<input id="r" type="number" min="1" max="1000" required value="${s?.reps??last?.reps??8}"></label><label>セット数<input id="n" type="number" min="1" max="50" required value="1" ${s?'disabled':''}></label><label>重量の種類<select id="mode">${[['normal','合計重量'],['pair','左右各重量'],['single','片側重量'],['body','自重＋追加重量']].map(([v,l])=>`<option value="${v}" ${v===(s?.mode||last?.mode||'normal')?'selected':''}>${l}</option>`).join('')}</select></label></div><label>休憩（秒）<input id="rest" type="number" min="0" max="3600" value="${s?.rest??db.rest}"></label><label>メモ<input id="note" value="${esc(s?.note||'')}" placeholder="アップ・RPE・フォームなど"></label><button class="full">${s?'変更を保存':'セット完了・タイマー開始'}</button></form>${s?'<button class="secondary full" onclick="editId=null;render()">編集をキャンセル</button>':''}</section><section><h3>${date} の記録</h3>${entries(date)}<p>総外部負荷：${fmt(byDate(date).reduce((a,s)=>a+volume(s),0))} kg</p><label>セッションメモ<textarea onchange="db.notes[date]=this.value;save()">${esc(db.notes[date]||'')}</textarea></label><button class="secondary full" onclick="shareDay()">ChatGPT用の記録をコピー</button></section>`}
function entries(d){return byDate(d).map(s=>`<div class="entry"><div>${esc(name(s.e))}<br><small>${s.mode==='body'?'自重＋':''}${fmt(s.w)} kg × ${s.reps}回 ${s.mode==='pair'?'（左右各）':''} ${esc(s.note)}</small></div><button class="secondary" onclick="editSet('${s.id}')">編集</button><button class="danger" onclick="deleteSet('${s.id}')">削除</button></div>`).join('')||'<p class="muted">記録なし</p>'}function editSet(id){let s=db.sets.find(s=>s.id===id);date=s.date;exercise=s.e;part='全部';tab='log';editId=id;render();window.scrollTo(0,0)}function deleteSet(id){if(confirm('このセットを削除しますか？')){db.sets=db.sets.filter(s=>s.id!==id);save();render()}}function addSet(ev){ev.preventDefault();let w=+$('w').value,reps=+$('r').value,n=editId?1:+$('n').value,rest=+$('rest').value,mode=$('mode').value,note=$('note').value,old=best(exercise),isEdit=!!editId;if(!Number.isFinite(w)||w<0||!Number.isInteger(reps)||reps<1||n<1||n>50)return;if(editId)Object.assign(db.sets.find(s=>s.id===editId),{w,reps,mode,note,rest});else for(let i=0;i<n;i++)db.sets.push({id:uid(),date,e:exercise,w,reps,mode,note,rest});editId=null;db.rest=rest;save();render();if(!isEdit&&mode!=='body'&&w>old&&old>0)toast('自己ベスト更新！ '+fmt(w)+' kg');else toast('保存しました');if(!isEdit&&rest&&date===today())startTimer(rest)}
function startTimer(s){timerEnd=Date.now()+s*1000;$('timer').hidden=false;tick()}function stopTimer(){timerEnd=0;$('timer').hidden=true}function tick(){if(!timerEnd)return;let t=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));$('clock').textContent=`${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`;if(!t){timerEnd=0;toast('インターバル終了！');try{navigator.vibrate?.(300)}catch(e){}}}setInterval(tick,250);
function history(){let [y,m]=month.split('-').map(Number),first=new Date(y,m-1,1).getDay(),days=new Date(y,m,0).getDate();return `<section><div class="row"><button class="secondary" onclick="changeMonth(-1)">‹</button><h3 style="text-align:center">${month}</h3><button class="secondary" onclick="changeMonth(1)">›</button></div><div class="calendar">${['日','月','火','水','木','金','土'].map(s=>`<small style="text-align:center">${s}</small>`).join('')}${'<span></span>'.repeat(first)}${Array.from({length:days},(_,i)=>{let d=month+'-'+String(i+1).padStart(2,'0'),ss=byDate(d);return `<button class="${ss.length?'marked':''} ${d===date?'chosen':''}" onclick="date='${d}';render()">${i+1}${ss.length?'<br>'+ss.length+'set':''}</button>`}).join('')}</div></section><section><h3>${date}</h3>${entries(date)}<p>${esc(db.notes[date]||'')}</p><button class="full" onclick="go('log')">この日の記録を編集</button></section>`}function changeMonth(n){let [y,m]=month.split('-').map(Number),d=new Date(y,m-1+n,1);month=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');render()}
let metric='max';function stats(){let ss=db.sets.filter(s=>s.e===exercise&&s.mode!=='body');return `<section><label>種目<select onchange="exercise=this.value;render()">${db.exercises.map(e=>`<option value="${e.id}" ${e.id===exercise?'selected':''}>${esc(e.name)}</option>`).join('')}</select></label><div class="grid"><div><small>最大重量</small><div class="big">${fmt(best(exercise))}</div></div><div><small>推定MAX (Epley)</small><div class="big">${fmt(Math.max(0,...ss.map(est)))}</div></div></div><label>グラフ<select onchange="metric=this.value;render()"><option value="max" ${metric==='max'?'selected':''}>最大重量</option><option value="est" ${metric==='est'?'selected':''}>推定MAX</option><option value="vol" ${metric==='vol'?'selected':''}>総外部負荷</option><option value="body" ${metric==='body'?'selected':''}>体重</option></select></label><canvas id="chart"></canvas><small>推定MAXは目安。左右重量は片手表示。外部負荷には自重を含まない。</small></section><section><h3>体重記録</h3><form onsubmit="addWeight(event)"><div class="row"><input id="wd" type="date" value="${today()}" required><input id="wk" type="number" min="1" max="500" step="0.1" placeholder="kg" required></div><button class="full">体重を保存</button></form>${[...db.weights].sort((a,b)=>b.date.localeCompare(a.date)).map(w=>`<div class="entry"><div>${esc(w.date)} / ${fmt(w.kg)}kg</div><button class="danger" onclick="db.weights=db.weights.filter(x=>x.id!=='${w.id}');save();render()">削除</button></div>`).join('')}</section><section><h3>直近30日の部位別セット数</h3>${parts.map(p=>{let cutoff=new Date();cutoff.setDate(cutoff.getDate()-29);let n=db.sets.filter(s=>ex(s.e)?.part===p&&new Date(s.date+'T23:59:59')>=cutoff&&s.date<=today()).length;return `<div class="entry"><div>${p}</div>${n} セット</div>`}).join('')}</section>`}function addWeight(e){e.preventDefault();let date=$('wd').value,kg=+$('wk').value;db.weights=db.weights.filter(w=>w.date!==date);db.weights.push({id:uid(),date,kg});save();render();toast('体重を保存しました')}function draw(){let c=$('chart');if(!c)return;let w=c.clientWidth||300,h=190,dpr=devicePixelRatio||1;c.width=w*dpr;c.height=h*dpr;let ctx=c.getContext('2d');ctx.scale(dpr,dpr);let map={};if(metric==='body'){db.weights.forEach(s=>map[s.date]=s.kg)}else db.sets.filter(s=>s.e===exercise&&(metric==='vol'||s.mode!=='body')).forEach(s=>{map[s.date]=metric==='vol'?(map[s.date]||0)+volume(s):Math.max(map[s.date]||0,metric==='est'?est(s):s.w)});let pts=Object.entries(map).sort();ctx.fillStyle='#aabbd0';ctx.font='11px system-ui';if(!pts.length){ctx.fillText('データなし',12,30);return}let vals=pts.map(p=>p[1]),lo=Math.min(...vals),hi=Math.max(...vals),pad=Math.max((hi-lo)*.12,1);lo=Math.max(0,lo-pad);hi+=pad;let xy=(v,i)=>[40+(w-58)*(pts.length===1?.5:i/(pts.length-1)),12+(h-42)*(hi-v)/(hi-lo)];for(let i=0;i<4;i++){let y=12+(h-42)*i/3;ctx.strokeStyle='#35445b';ctx.beginPath();ctx.moveTo(40,y);ctx.lineTo(w-12,y);ctx.stroke();ctx.fillText(fmt(hi-(hi-lo)*i/3),0,y+4)}ctx.strokeStyle='#6ba4ff';ctx.lineWidth=2;ctx.beginPath();pts.forEach((p,i)=>{let [x,y]=xy(p[1],i);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();pts.forEach((p,i)=>{let [x,y]=xy(p[1],i);ctx.fillStyle='#6ba4ff';ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fill();if(i===0||i===pts.length-1||pts.length<=4){ctx.fillStyle='#aabbd0';ctx.fillText(p[0].slice(5),x-15,h-5)}})}
function settings(){return `<section><h3>目標設定</h3><form onsubmit="event.preventDefault();db.goals={bench:+$('gb').value,body:+$('gw').value};save();render();toast('目標を保存しました')"><div class="grid"><label>ベンチ kg<input id="gb" type="number" min="1" required value="${db.goals.bench}"></label><label>体重 kg<input id="gw" type="number" min="1" required value="${db.goals.body}"></label></div><button class="full">保存</button></form></section><section><h3>種目の追加・編集</h3><form onsubmit="saveExercise(event)"><label>編集対象<select id="eid" onchange="let e=ex(this.value);$('en').value=e?.name||'';$('ep').value=e?.part||'胸'"><option value="">新規追加</option>${db.exercises.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('')}</select></label><label>種目名<input id="en" required maxlength="80"></label><label>部位<select id="ep">${parts.map(p=>`<option>${p}</option>`).join('')}</select></label><button class="full">種目を保存</button></form></section><section><h3>Appleヘルスケア取り込み</h3><p class="muted">ショートカットで取得した日付・歩数・体重などのJSONを貼り付けるか、ファイルを選択してください。未取得項目は空欄のまま表示します。</p><textarea id="healthjson" placeholder='{"date":"2026-11-24","steps":5000,"kg":69}'></textarea><button class="full" onclick="importHealth($('healthjson').value)">JSONを取り込む</button><label>JSONファイル<input type="file" accept=".json,application/json" onchange="readFile(this,importHealth)"></label><small>対応項目：date, minutes, kcal, bpm, steps, kg。日単位で更新します。</small><div>${db.health.map(h=>`<div class="entry"><div>${esc(h.date)} / ヘルスケア</div><button class="danger" onclick="db.health=db.health.filter(h=>h.date!=='${h.date}');save();render()">削除</button></div>`).join('')}</div></section><section><h3>バックアップ・共有</h3><button class="full secondary" onclick="downloadBackup()">全データをJSON保存</button><label>バックアップから復元（現在のデータを置換）<input type="file" accept=".json,application/json" onchange="readFile(this,restore)"></label><button class="full secondary" onclick="shareAll()">全記録をChatGPT用にコピー</button><p class="muted">データはこのブラウザ内に保存されます。端末間で自動同期はしません。定期的にバックアップしてください。</p></section>`}function saveExercise(ev){ev.preventDefault();let id=$('eid').value,n=$('en').value.trim(),p=$('ep').value;if(!n)return;if(id)Object.assign(ex(id),{name:n,part:p});else db.exercises.push({id:uid(),name:n,part:p});save();render();toast('種目を保存しました')}
function readFile(input,fn){let f=input.files[0];if(f)f.text().then(fn).catch(()=>alert('ファイルを読めませんでした'))}const validDate=d=>typeof d==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d)&&!isNaN(Date.parse(d));function importHealth(raw){try{let data=JSON.parse(raw),rows=Array.isArray(data)?data:[data];if(!rows.length)throw Error();let clean=rows.map(r=>{if(!validDate(r.date))throw Error();let h={date:r.date};for(let k of ['minutes','kcal','bpm','steps','kg'])if(r[k]!=null&&r[k]!==''){let v=Number(r[k]);if(!Number.isFinite(v)||v<0||(k==='kg'&&v<=0))throw Error();h[k]=v}if(Object.keys(h).length===1)throw Error();return h});for(let h of clean){let old=db.health.find(x=>x.date===h.date)||{};db.health=db.health.filter(x=>x.date!==h.date);db.health.push({...old,...h});if(h.kg){db.weights=db.weights.filter(w=>w.date!==h.date);db.weights.push({id:uid(),date:h.date,kg:h.kg})}}save();render();toast('ヘルスケアデータを取り込みました')}catch(e){alert('JSON形式、日付、数値を確認してください。')}}function downloadBackup(){let url=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));let a=document.createElement('a');a.href=url;a.download='iron-log-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function restore(raw){try{let d=JSON.parse(raw),safeId=s=>typeof s==='string'&&/^[a-zA-Z0-9-]+$/.test(s),num=n=>typeof n==='number'&&Number.isFinite(n)&&n>=0;if(d.version!==1||!Array.isArray(d.exercises)||!d.exercises.length||!d.exercises.every(e=>safeId(e.id)&&typeof e.name==='string'&&parts.includes(e.part))||!Array.isArray(d.sets)||!d.sets.every(s=>safeId(s.id)&&validDate(s.date)&&d.exercises.some(e=>e.id===s.e)&&num(s.w)&&Number.isInteger(s.reps)&&s.reps>0&&['normal','pair','single','body'].includes(s.mode))||!Array.isArray(d.weights)||!d.weights.every(w=>safeId(w.id)&&validDate(w.date)&&num(w.kg)&&w.kg>0)||!Array.isArray(d.health)||!d.health.every(h=>validDate(h.date)&&['minutes','kcal','bpm','steps','kg'].every(k=>h[k]==null||num(h[k])))||!d.goals||!num(d.goals.bench)||!d.goals.bench||!num(d.goals.body)||!d.goals.body||!num(d.rest)||!d.notes||typeof d.notes!=='object')throw Error();if(confirm('現在の記録をバックアップの内容で置き換えますか？')){db=d;exercise=db.exercises[0].id;save();render();toast('復元しました')}}catch(e){alert('IRON LOGの有効なバックアップではありません。')}}function dayText(d){let h=db.health.find(h=>h.date===d),w=db.weights.find(w=>w.date===d);return `${d}\n`+byDate(d).map(s=>`${name(s.e)} ${s.mode==='body'?'自重＋':''}${s.w}kg × ${s.reps}回${s.mode==='pair'?'（左右各）':''}${s.note?' '+s.note:''}`).join('\n')+(db.notes[d]?'\nメモ：'+db.notes[d]:'')+(w?'\n体重：'+w.kg+'kg':'')+(h?'\nヘルスケア：'+JSON.stringify(h):'')}async function copyText(t){try{await navigator.clipboard.writeText(t);toast('コピーしました')}catch(e){let a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{if(!document.execCommand('copy'))throw Error();toast('コピーしました')}catch(e){prompt('以下をコピーしてください',t)}a.remove()}}function shareDay(){copyText(dayText(date)+'\nこのトレーニングを評価し、次回のメニューを提案してください。')}function shareAll(){copyText([...new Set([...db.sets,...db.weights,...db.health].map(s=>s.date))].sort().map(dayText).join('\n\n')+'\n目標：ベンチ'+db.goals.bench+'kg、体重'+db.goals.body+'kg')}
render();window.addEventListener('resize',()=>{if(tab==='stats')draw()});if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></html>
